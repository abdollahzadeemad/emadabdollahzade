    <h1>عماد عبدالله زاده</h1>
    <p>
    در مدارس امام رضا و در رشته ریاضی تحصیل کردم
    در دانشگاه شهید بهشتی مشهد در رشته دبیری ریاضی لیسانس گرفتم
    در حال حاضر دانشجوی ارشد علوم داده هستم
    در شهر بجستان معلم ریاضی هستم
    تدریس زبان انگلیسی نیز داشتم 
    </p>
